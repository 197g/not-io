[package]
# Distribution information.
name = "flexible-io"
version = "0.6.0"
description = "Wraps values such that dyn-safe IO traits need not appear as static bounds"

license = "EUPL-1.2"
authors = ["Aurelia Molzer"]
categories = []
repository = "https://github.com/197g/not-io"
readme = "Readme.md"

# Packet configuration
edition = "2021"
rust-version = "1.88"

[dependencies]

[features]
# Enable this features to utilize `pointer::with_metadata_of`. Otherwise, the
# crate provides some replacement code that contains more unsafe code (still
# works under MIRI) that rewrites pointers.
unstable_set_ptr_value = []
# Alias for the other unstable feature.
unstable_with_metadata_of = ["unstable_set_ptr_value"]

# See try_as_dyn #144361 upstream. This methods do not have trait bounds at the
# call site, either. If this lands in stable then part of this crate is
# obsolete. However, the standard library makes no promises about the stability
# of the returned option (i.e. that it will `Some` in all contexts for the same
# type; or that it will be `Some` for certain modifications of a type). See the
# runtime failures section, it needs to under approximate for soundness. This
# retains the token aspect of the crate, it's merely a different path of
# arriving at that token.
unstable_try_as_dyn = []
